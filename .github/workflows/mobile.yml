# SPDX-License-Identifier: GPL-2.0-or-later
# CI for the XCSoar Mobile project (mobile/docs/PLAN.md).
# Kept separate from build-native.yml so upstream merges stay clean.

name: mobile

on:
  workflow_dispatch:
  push:
    branches:
      - mobile
      - 'mobile-*'
  pull_request:
    branches:
      - mobile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # L0: upstream C++ test suite must stay green.
  core-check:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim

    steps:
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Mark git directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache downloads
        uses: actions/cache@v6
        with:
          key: mobile-downloads-${{ hashFiles('build/libboost.mk', 'build/thirdparty.py', 'build/python/build/libs.py') }}
          restore-keys: mobile-downloads-
          path: ${{ github.workspace }}/output/download

      - name: Install build dependencies
        run: |
          ./ide/provisioning/install-debian-packages.sh UPDATE
          ./ide/provisioning/install-debian-packages.sh BASE
          ./ide/provisioning/install-debian-packages.sh LINUX

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mobile-UNIX-ccache
          max-size: 2G

      - name: Build and run tests
        run: make -j$(nproc) TARGET=UNIX USE_CCACHE=y check

  # L1 + L2: the headless core (C API contract tests, golden replays)
  core-api:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim

    steps:
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Mark git directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache downloads
        uses: actions/cache@v6
        with:
          key: mobile-downloads-${{ hashFiles('build/libboost.mk', 'build/thirdparty.py', 'build/python/build/libs.py') }}
          restore-keys: mobile-downloads-
          path: ${{ github.workspace }}/output/download

      - name: Install build dependencies
        run: |
          ./ide/provisioning/install-debian-packages.sh UPDATE
          ./ide/provisioning/install-debian-packages.sh BASE
          ./ide/provisioning/install-debian-packages.sh LINUX

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mobile-UNIX-VFB-ccache
          max-size: 2G

      # On failure, the key lines become annotations, which are readable
      # without access to the full log.
      - name: Build the core
        shell: bash
        run: |
          set -o pipefail
          make -j$(nproc) TARGET=UNIX VFB=y USE_CCACHE=y core 2>&1 | tee build.log || {
            grep -E " error:|undefined reference|Error [0-9]" build.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Test the core
        shell: bash
        run: |
          set -o pipefail
          make TARGET=UNIX VFB=y USE_CCACHE=y core-check 2>&1 | tee check.log || {
            grep -E "^not ok|^FAIL|^  line|Failed|Assertion|error:|Error" check.log | head -30 | sed 's/^/::error::/'
            exit 1
          }

  # L3 + the Android app: native core (arm64), APK, Kotlin unit tests
  mobile-app:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim

    steps:
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Mark git directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache downloads
        uses: actions/cache@v6
        with:
          key: mobile-downloads-${{ hashFiles('build/libboost.mk', 'build/thirdparty.py', 'build/python/build/libs.py') }}
          restore-keys: mobile-downloads-
          path: ${{ github.workspace }}/output/download

      - name: Cache Android SDK and NDK
        uses: actions/cache@v6
        with:
          key: mobile-android-tools-${{ hashFiles('ide/provisioning/install-android-tools.sh') }}
          restore-keys: mobile-android-tools-
          path: |
            ~/opt/android-sdk-linux
            ~/opt/android-ndk-r26d

      - name: Cache third-party libraries (arm64)
        uses: actions/cache@v6
        with:
          key: mobile-thirdparty-arm64-${{ hashFiles('build/thirdparty.py', 'build/python/build/*.py', 'build/thirdparty.mk', 'build/targets.mk', 'lib/**/patches/**') }}
          path: ${{ github.workspace }}/output/ANDROID/arm64-v8a/lib

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          key: mobile-gradle-${{ hashFiles('mobile/gradle/libs.versions.toml', 'mobile/gradle/wrapper/gradle-wrapper.properties', 'mobile/**/*.gradle.kts') }}
          restore-keys: mobile-gradle-
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Install build dependencies
        run: |
          ./ide/provisioning/install-debian-packages.sh UPDATE
          ./ide/provisioning/install-debian-packages.sh BASE
          ./ide/provisioning/install-debian-packages.sh LINUX
          ./ide/provisioning/install-debian-packages.sh ARM
          ./ide/provisioning/install-debian-packages.sh LLVM
          ./ide/provisioning/install-debian-packages.sh ANDROID
          ./ide/provisioning/install-android-tools.sh NDK
          ./ide/provisioning/install-android-tools.sh SDK

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mobile-android-arm64-ccache
          max-size: 2G

      - name: Build the app and run the Kotlin tests
        shell: bash
        working-directory: mobile
        env:
          ANDROID_HOME: /github/home/opt/android-sdk-linux
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :core:test :app:assembleDebug 2>&1 | tee build.log || {
            grep -E "^e: | error:|error:|FAILED|What went wrong" -A3 build.log | head -30 | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: xcsoar-mobile-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
